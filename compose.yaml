services:
  postgres:
    image: postgres:17-alpine
    container_name: dev-market-postgres
    environment:
      - POSTGRES_USER=devmarket
      - POSTGRES_PASSWORD=devmarket
      - POSTGRES_DB=dev_market
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
    